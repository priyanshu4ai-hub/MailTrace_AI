name: 💡 Feature Request
description: Suggest a new capability, parser enhancement, or detection heuristic
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions! Please describe the use case and how it benefits DFIR analysts.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or gap?
      placeholder: "e.g. I am frustrated when analyzing QR-code phishing emails because..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Any alternative solutions or features you've considered?
  - type: dropdown
    id: area
    attributes:
      label: Target Area
      options:
        - Detection Rules & Heuristics
        - OSINT & Threat Intel Feeds
        - Protocol Verification (SPF/DKIM/DMARC/BIMI)
        - Visualizations & Graph Analysis
        - Reporting & SIEM Export
        - Other
